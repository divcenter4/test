<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to GitHub</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    background-color: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .main-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 24px;
    flex: 1;
  }

  .github-logo {
    color: #e6edf3;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 24px;
    font-weight: 400;
    margin-bottom: 24px;
    text-align: center;
  }

  form {
    width: 308px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #e6edf3;
  }

  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .forgot-password {
    font-size: 12px;
    color: #539bf5;
    text-decoration: none;
    font-weight: 400;
  }

  .forgot-password:hover {
    text-decoration: underline;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 5px 12px;
    font-size: 14px;
    line-height: 20px;
    color: #e6edf3;
    background-color: #0d1117;
    border: 1px solid #2d333b;
    border-radius: 6px;
    outline: none;
    height: 32px;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: #539bf5;
    box-shadow: 0 0 0 3px rgba(83, 155, 245, 0.15);
  }

  .sign-in-btn {
    width: 100%;
    padding: 5px 16px;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    color: #ffffff;
    background-color: #238636;
    border: 1px solid rgba(240, 246, 252, 0.1);
    border-radius: 6px;
    cursor: pointer;
    height: 36px;
    transition: background-color 0.2s ease;
  }

  .sign-in-btn:hover {
    background-color: #29903b;
  }

  .divider {
    display: flex;
    align-items: center;
    width: 308px;
    margin: 20px 0;
    color: #7d8590;
    font-size: 13px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background-color: #30363d;
  }

  .divider span {
    padding: 0 8px;
  }

  .oauth-btn {
    width: 308px;
    display: flex;
    margin-left: auto;
    margin-right: auto;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 34px;
    padding: 5px 16px;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    color: #e6edf3;
    background-color: #21262d;
    border: 1px solid rgba(240, 246, 252, 0.1);
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: background-color 0.2s ease;
    font-family: inherit;
  }

  .oauth-btn:hover {
    background-color: #30363d;
  }

  .create-account {
    width: 308px;
    text-align: center;
    margin-top: 24px;
    padding: 16px;
    font-size: 14px;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    background-color: transparent;
  }

  .create-account a {
    color: #539bf5;
    text-decoration: none;
  }

  .create-account a:hover {
    text-decoration: underline;
  }

  .passkey-link {
    width: 308px;
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
  }

  .passkey-link a {
    color: #539bf5;
    text-decoration: none;
  }

  .passkey-link a:hover {
    text-decoration: underline;
  }

  footer {
    width: 100%;
    padding: 24px 0;
    border-top: 1px solid #21262d;
    margin-top: 40px;
  }

  footer nav {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  footer a {
    color: #7d8590;
    font-size: 12px;
    text-decoration: none;
  }

  footer a:hover {
    color: #539bf5;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="main-content">
  <div class="github-logo">
    <svg data-component="Octicon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="48" height="48" fill="currentColor" display="inline-block" overflow="visible" style="vertical-align:text-bottom"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"></path></svg>
  </div>

  <h1>Sign in to GitHub</h1>

  <form>
    <div class="form-group">
      <label for="username">Username or email address</label>
      <input type="text" id="username" name="username" autocomplete="username" spellcheck="false" autofocus>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="password">Password</label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>
      <input type="password" id="password" name="password" autocomplete="current-password">
    </div>

    <input type="submit" value="Sign in" class="sign-in-btn">
  </form>

  <div class="divider"><span>or</span></div>

  <button type="button" class="oauth-btn">
    <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g clip-path="url(#clip0_643_9687)">
        <path d="M8.00018 3.16667C9.18018 3.16667 10.2368 3.57333 11.0702 4.36667L13.3535 2.08333C11.9668 0.793333 10.1568 0 8.00018 0C4.87352 0 2.17018 1.79333 0.853516 4.40667L3.51352 6.47C4.14352 4.57333 5.91352 3.16667 8.00018 3.16667Z" fill="#EA4335"></path>
        <path d="M15.66 8.18335C15.66 7.66002 15.61 7.15335 15.5333 6.66669H8V9.67335H12.3133C12.12 10.66 11.56 11.5 10.72 12.0667L13.2967 14.0667C14.8 12.6734 15.66 10.6134 15.66 8.18335Z" fill="#4285F4"></path>
        <path d="M3.51 9.53001C3.35 9.04668 3.25667 8.53334 3.25667 8.00001C3.25667 7.46668 3.34667 6.95334 3.51 6.47001L0.85 4.40668C0.306667 5.48668 0 6.70668 0 8.00001C0 9.29334 0.306667 10.5133 0.853333 11.5933L3.51 9.53001Z" fill="#FBBC05"></path>
        <path d="M8.0001 16C10.1601 16 11.9768 15.29 13.2968 14.0633L10.7201 12.0633C10.0034 12.5467 9.0801 12.83 8.0001 12.83C5.91343 12.83 4.14343 11.4233 3.5101 9.52667L0.850098 11.59C2.1701 14.2067 4.87343 16 8.0001 16Z" fill="#34A853"></path>
      </g>
      <defs>
        <clipPath id="clip0_643_9687">
          <rect width="16" height="16" fill="white"></rect>
        </clipPath>
      </defs>
    </svg>
    Continue with Google
  </button>

  <button type="button" class="oauth-btn">
    <span class="Button-visual Button-leadingVisual">
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" width="16" height="16" class="octicon">
        <g clip-path="url(#clip0_3150_11451)">
          <path d="M8.08803 4.3535C8.74395 4.3535 9.56615 3.91006 10.0558 3.31881C10.4992 2.78299 10.8226 2.03469 10.8226 1.28639C10.8226 1.18477 10.8133 1.08314 10.7948 1C10.065 1.02771 9.18738 1.48963 8.6608 2.10859C8.24508 2.57975 7.86631 3.31881 7.86631 4.07635C7.86631 4.18721 7.88479 4.29807 7.89402 4.33502C7.94021 4.34426 8.01412 4.3535 8.08803 4.3535ZM5.77846 15.5318C6.67457 15.5318 7.07182 14.9313 8.18965 14.9313C9.32596 14.9313 9.57539 15.5133 10.5731 15.5133C11.5524 15.5133 12.2083 14.608 12.8273 13.7211C13.5201 12.7049 13.8065 11.7072 13.825 11.661C13.7603 11.6425 11.885 10.8757 11.885 8.7232C11.885 6.85707 13.3631 6.01639 13.4462 5.95172C12.467 4.5475 10.9796 4.51055 10.5731 4.51055C9.47377 4.51055 8.57766 5.1757 8.01412 5.1757C7.4044 5.1757 6.60066 4.5475 5.64912 4.5475C3.83842 4.5475 2 6.0441 2 8.87101C2 10.6263 2.68363 12.4832 3.52432 13.6842C4.2449 14.7004 4.87311 15.5318 5.77846 15.5318Z" fill="currentColor"></path>
        </g>
        <defs>
          <clipPath id="clip0_3150_11451">
            <rect width="16" height="16"></rect>
          </clipPath>
        </defs>
      </svg>
    </span>
    Continue with Apple
  </button>

  <div class="create-account">
    New to GitHub? <a href="#">Create an account</a>.
  </div>

  <div class="passkey-link">
    <a href="#">Sign in with a passkey</a>
  </div>
</div>

<footer>
  <nav>
    <a href="#">Terms</a>
    <a href="#">Privacy</a>
    <a href="#">Docs</a>
    <a href="#">Contact GitHub Support</a>
    <a href="#">Manage cookies</a>
    <a href="#">Do not share my personal information</a>
  </nav>
</footer>

</body>
</html>
