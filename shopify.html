<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Shopify</title>
  <link rel="shortcut icon" type="image/x-icon" href="https://shopify-assets.shopifycdn.com/shopify-marketing_assets/static/shopify-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: rgb(32, 34, 35);
      background-color: #0a1314;
      background-image: radial-gradient(ellipse 80% 60% at 50% 0%, #12262a 0%, #0a1314 55%, #060c0d 100%);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      display: flex;
      justify-content: center;
      padding: 48px 0 44px;
    }
    .shopify-logo {
      width: 72px;
      height: 81px;
      display: block;
    }

    .card {
      width: 490px;
      max-width: calc(100vw - 32px);
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 10px 40px rgba(0,0,0,.35);
      padding: 40px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -.01em;
      color: rgb(26, 28, 29);
    }
    .subheading {
      margin-top: 4px;
      font-size: 14px;
      color: rgb(109, 113, 117);
      font-weight: 400;
    }

    form { margin-top: 24px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: rgb(32, 34, 35);
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      color: rgb(32, 34, 35);
      background: #fff;
      border: 1px solid rgb(140, 145, 150);
      border-radius: 8px;
      outline: none;
      transition: box-shadow .1s ease, border-color .1s ease;
    }
    .field input:hover { border-color: rgb(109, 113, 117); }
    .field input:focus {
      border-color: rgb(44, 110, 203);
      box-shadow: 0 0 0 1px rgb(44, 110, 203);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 44px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: background-color .1s ease, box-shadow .1s ease;
    }

    .btn-primary {
      margin-top: 20px;
      background: rgb(26, 28, 29);
      color: #fff;
    }
    .btn-primary:hover { background: rgb(47, 49, 51); }
    .btn-primary svg { opacity: 0; margin-left: -28px; transition: all .15s ease; }
    .btn-primary:hover svg { opacity: 1; margin-left: 0; }

    .btn-secondary {
      background: rgb(246, 246, 247);
      color: rgb(32, 34, 35);
    }
    .btn-secondary:hover { background: rgb(241, 242, 243); }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px 0;
      color: rgb(109, 113, 117);
      font-size: 13px;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgb(225, 227, 229);
    }

    .social-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      background: rgb(246, 246, 247);
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color .1s ease;
    }
    .social-btn:hover { background: rgb(241, 242, 243); }
    .social-btn svg { width: 20px; height: 20px; }

    .signup {
      margin-top: 28px;
      font-size: 14px;
      color: rgb(32, 34, 35);
    }
    .signup a {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      color: rgb(44, 110, 203);
      font-weight: 500;
      text-decoration: none;
      margin-left: 4px;
    }
    .signup a:hover { text-decoration: underline; }
    .signup a svg { transition: transform .1s ease; }
    .signup a:hover svg { transform: translateX(2px); }

    footer {
      margin-top: auto;
      padding: 36px 24px 16px;
      text-align: center;
    }
    .footer-help { margin-bottom: 10px; }
    .footer-help a {
      color: rgb(227, 229, 231);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }
    .footer-help a:hover { text-decoration: underline; }
    .footer-terms {
      font-size: 12px;
      color: rgb(153, 159, 164);
      line-height: 1.5;
    }
    .footer-terms a {
      color: rgb(227, 229, 231);
      font-weight: 600;
      text-decoration: none;
    }
    .footer-terms a:hover { text-decoration: underline; }

    .hidden-svg { display: none; }
  </style>
</head>
<body>

    </header>

        New to Shopify?
