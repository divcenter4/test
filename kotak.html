<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotak Net Banking</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#fff;color:#333;display:flex;flex-direction:column;overflow:hidden}

.logo{position:absolute;top:22px;left:30px;width:150px;z-index:20}
.logo img{width:100%;height:auto;display:block}

.main{flex:1;display:flex;width:100%;min-height:0;position:relative;overflow:hidden}

.left{flex:1 1 auto;position:relative;min-width:0;overflow:hidden}
.left img{position:absolute;left:0;bottom:0;height:92vh;width:auto;max-width:none;display:block}

.right{flex:0 0 480px;display:flex;align-items:center;justify-content:flex-end;padding:0 30px 0 20px;position:relative;z-index:5}

.login-card{width:440px;background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.10);padding:42px 38px 30px}

.card-title{font-size:22px;font-weight:700;color:#1a1a1a;letter-spacing:-.3px}
.card-subtitle{font-size:12.5px;color:#555;margin-top:6px;letter-spacing:.3px}

.card-input{width:100%;height:52px;border:1px solid #ccc;border-radius:4px;padding:0 14px;margin-top:26px;font-size:14.5px;font-family:inherit;outline:none;color:#333}
.card-input::placeholder{color:#9a9a9a}
.card-input:focus{border-color:#00558C;box-shadow:0 0 0 2px rgba(0,85,140,.12)}

.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.remember{font-size:12.5px;color:#555;display:flex;align-items:center;gap:6px;cursor:pointer}
.remember input{width:14px;height:14px;margin:0;accent-color:#00558C;cursor:pointer}
.vk{font-size:12.5px;color:#1a73c9;text-decoration:underline;cursor:pointer}

.help{font-size:13.5px;color:#1a73c9;text-decoration:none;display:inline-block;margin-top:26px}
.help:hover{text-decoration:underline}

.terms{font-size:12px;color:#666;line-height:1.55;margin-top:32px}
.terms a{color:#1a73c9;text-decoration:underline}

.card-footer{border-top:1px solid #eee;padding-top:20px;margin-top:30px;display:flex;justify-content:flex-end}
.next-btn{padding:12px 38px;background:#FBDADA;color:#ED1C24;border:none;border-radius:4px;font-weight:600;font-size:14.5px;font-family:inherit;cursor:pointer;letter-spacing:.3px;opacity:.9}

.footer{border-top:1px solid #e0e0e0;padding:22px 34px;position:relative;background:#fff;flex:0 0 auto;z-index:5}
.note{font-size:13px;color:#333;text-align:center;margin:0}
.note a{color:#1a73c9;text-decoration:none}
.note a:hover{text-decoration:underline}
.browser{position:absolute;right:34px;bottom:22px;font-size:12px;font-weight:600;color:#333;text-decoration:none}

@media (max-width:1300px){
  .right{flex:0 0 440px;padding:0 22px 0 10px}
  .login-card{width:410px;padding:36px 32px 26px}
  .card-title{font-size:21px}
  .left img{height:88vh}
}

@media (max-width:980px){
  body{overflow:auto}
  .main{flex-direction:column;padding:80px 20px 20px;overflow:visible}
  .left{width:100%;min-height:280px;flex:0 0 auto}
  .left img{position:static;height:auto;width:100%;max-width:560px;margin:0 auto}
  .right{flex:0 0 auto;width:100%;padding:20px 0 0;justify-content:center}
  .login-card{width:100%;max-width:440px}
  .logo{top:20px;left:20px;width:130px}
  .footer{padding:20px}
  .browser{position:relative;right:auto;bottom:auto;display:block;text-align:right;margin-top:12px}
}
</style>
</head>
<body>

<a href="#" class="logo">
  <img src="https://netbanking.kotak.bank.in/knb2-gift/assets/images/Logo.svg" alt="Kotak Mahindra Bank">
</a>

<div class="main">
  <div class="left">
    <img src="https://netbanking.kotak.bank.in/knb2-gift/assets/images/giftbg.jpg" alt="">
  </div>
  <div class="right">
    <div class="login-card">
      <div class="card-title">Login to Kotak Mahindra Bank</div>
      <div class="card-subtitle">GIFT CITY BRANCH</div>

      <input type="text" class="card-input" placeholder="CRN, Username">

      <div class="row">
        <label class="remember"><input type="checkbox">Remember me</label>
        <span class="vk">Use virtual keypad</span>
      </div>

      <a href="#" class="help">Need help?</a>

      <p class="terms">By clicking on 'Next', you accept that you have read our <a href="#">Terms &amp; conditions</a>.</p>

      <div class="card-footer">
        <button class="next-btn">Next</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <p class="note">Kindly visit <a href="#">https://www.kotak.bank.in/en/personal-banking/gift/products-and-services.html</a> for more information.</p>
  <a href="#" class="browser">Browser Compatibility</a>
</div>

</body>
</html>
