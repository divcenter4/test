<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhonePe POS Register</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#fff;color:#2c2c2c;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

.header{height:78px;display:flex;align-items:center;padding:0 60px;gap:60px}
.logo img{height:46px;width:auto}
.nav{display:flex;gap:54px;font-size:13.5px;font-weight:600;color:#1a1a1a;letter-spacing:.4px;margin-left:100px}
.nav a:hover{color:#5f259f}

.page{max-width:1320px;margin:0 auto;padding:20px 60px 80px;display:grid;grid-template-columns:1fr 540px;gap:80px;align-items:flex-start}

.breadcrumb{display:flex;align-items:center;gap:10px;font-size:15px;color:#4a4a4a;margin-bottom:28px}
.breadcrumb svg{width:18px;height:18px;stroke:#4a4a4a;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.breadcrumb .sep{color:#9a9a9a}
.breadcrumb .current{color:#5f259f;font-weight:500}

h1{font-size:30px;font-weight:700;color:#3b1a63;line-height:1.3;letter-spacing:-.3px;max-width:460px}

.section-title{font-size:16px;font-weight:700;color:#3b1a63;margin-top:38px;margin-bottom:22px}

.field{position:relative;margin-bottom:24px}
.field input,.field select{width:100%;border:none;border-bottom:1.5px solid #5f259f;background:transparent;padding:0 0 8px;font-size:15px;font-family:inherit;color:#1a1a1a;outline:none;appearance:none;border-radius:0;cursor:text}
.field input::placeholder{color:#9a9a9a;font-size:15px}
.field select{color:#9a9a9a;cursor:pointer}
.field .chev{position:absolute;right:4px;bottom:14px;width:16px;height:16px;pointer-events:none}
.field .chev svg{width:16px;height:16px;stroke:#1a1a1a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.loc-btn{display:inline-flex;align-items:center;gap:8px;background:#5f259f;color:#fff;border:none;border-radius:4px;padding:13px 22px;font-size:14.5px;font-weight:500;font-family:inherit;cursor:pointer;margin-top:4px}
.loc-btn:hover{background:#4d1f83}

.proof-label{font-size:15px;color:#4a4a4a;margin-top:32px;margin-bottom:16px}
.checks{display:flex;flex-wrap:wrap;gap:14px 34px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:#1a1a1a;cursor:pointer;font-weight:400}
.check input{width:16px;height:16px;margin:0;accent-color:#5f259f;cursor:pointer}

.right-col{position:relative}
.illustration{background:#d8ecf0;border-radius:8px;overflow:hidden}
.illustration img{width:100%;height:auto;display:block}

.captcha{margin-top:22px;width:230px;border:1px solid #d6d6d6;border-radius:6px;background:#fafafa;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.captcha-text{display:flex;flex-direction:column;gap:3px}
.captcha-text .t{font-size:13px;color:#1a1a1a}
.captcha-text .l{font-size:11px;color:#7a7a7a}
.captcha-text .l a{color:#7a7a7a;text-decoration:none}
.captcha-logo{width:42px;height:42px;flex:0 0 auto}

@media (max-width:1200px){
  .header{padding:0 30px;gap:30px}
  .nav{gap:34px;margin-left:20px}
  .page{padding:20px 30px 60px;gap:50px;grid-template-columns:1fr 480px}
}
@media (max-width:1000px){
  .page{grid-template-columns:1fr;gap:40px}
  .right-col{max-width:600px}
}
@media (max-width:700px){
  .header{height:auto;padding:16px 18px;flex-direction:column;align-items:flex-start;gap:14px}
  .nav{flex-wrap:wrap;gap:18px;margin-left:0;font-size:12.5px}
  h1{font-size:24px}
}
</style>
</head>

<main class="page">

  <div class="left-col">

    <div class="breadcrumb">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>
      <span class="sep">/</span>
      <span>POS Machine</span>
      <span class="sep">/</span>
      <span class="current">Register</span>
    </div>

    <h1>Start accepting payments with PhonePe POS Device</h1>

    <div class="section-title">Business Details</div>

    <div class="field">
      <input type="text" placeholder="Enter Store/Brand Name*">
    </div>

    <div class="field">
      <select>
        <option>How many stores do you have?*</option>
        <option>1</option>
        <option>2-5</option>
        <option>6-10</option>
        <option>10+</option>
      </select>
      <span class="chev"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>

    <div class="field">
      <input type="text" placeholder="Enter Address Line 1*">
    </div>

    <div class="field">
      <input type="text" placeholder="Enter Address Line 2*">
    </div>

    <div class="field">
      <input type="text" placeholder="Postal Pincode*">
    </div>

    <div class="field">
      <input type="text" placeholder="Enter City*">
    </div>

    <button class="loc-btn">Use Current Location</button>

    <div class="proof-label">Mention the proof of business document available*</div>

    <div class="checks">
      <label class="check"><input type="checkbox">GST Certificate</label>
      <label class="check"><input type="checkbox">SEA Certificate</label>
      <label class="check"><input type="checkbox">Trade License</label>
      <label class="check"><input type="checkbox">FSSAI</label>
      <label class="check"><input type="checkbox">Others</label>
    </div>

    <div class="section-title">Personal Details</div>

    <div class="field">
      <input type="text" placeholder="Enter First and Last Name*">
    </div>

  </div>

  <div class="right-col">
    <div class="illustration">
      <img src="https://www.phonepe.com/webstatic/14913/static/3e49f3e9393b9df3f71621189571d046/e749e/phonepe_pos_register_desktop.webp" alt="">
    </div>

    <div class="captcha">
      <div class="captcha-text">
        <span class="t">Protected by <b>hCaptcha</b></span>
        <span class="l"><a href="#">Privacy</a> - <a href="#">Terms</a></span>
      </div>

        <circle cx="30" cy="20" r="2" fill="#fff"/>
        <path d="M18 30c2 2 5 3 8 2" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
