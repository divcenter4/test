<!DOCTYPE html>
<html lang="en-IN" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send &amp; Request Money, Shop, Manage Payments &amp; More | PayPal IN</title>
  <link rel="icon" sizes="32x32" href="https://www.paypalobjects.com/marketing/web/icons/monogram/pp32.png">
  <link rel="preconnect" href="https://www.paypalobjects.com" crossorigin>
  <style>
    @font-face {
      font-family: 'PayPal Pro';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url("https://www.paypalobjects.com/marketing/pp-com-components/fonts/PayPal%20Pro/PayPalProSWeb-Book.woff2") format("woff2");
    }
    @font-face {
      font-family: 'PayPal Pro';
      font-weight: 900;
      font-style: normal;
      font-display: swap;
      src: url("https://www.paypalobjects.com/marketing/pp-com-components/fonts/PayPal%20Pro/PayPalProSWeb-Black.woff2") format("woff2");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'PayPal Pro', 'PayPal Pro Text VF', Helvetica, Arial, sans-serif;
      color: #000;
      background: #00b2f0;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    ul { list-style: none; }

    /* ============ Header ============ */
    header {
      background: #fff9f2;
      height: 88px;
      position: relative;
      z-index: 10;
    }
    .header-inner {
      max-width: 1390px;
      height: 100%;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
    }
    .logo {
      width: 44px;
      height: 44px;
      background: url("https://www.paypalobjects.com/marketing/web/logos/paypal-mark-color_new.svg") center / contain no-repeat;
      display: block;
      flex-shrink: 0;
      margin-right: 40px;
    }
    nav.main-menu {
      display: flex;
      align-items: center;
      flex: 1;
    }
    nav.main-menu > ul {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 16px;
      font-weight: 400;
      padding: 10px 14px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: #000;
      position: relative;
    }
    .nav-link:hover { background: rgba(0, 0, 0, 0.05); }
    .nav-link .chevron {
      width: 12px;
      height: 12px;
      border-right: 2px solid #000;
      border-bottom: 2px solid #000;
      transform: rotate(45deg) translateY(-3px);
      margin-top: -4px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      border-radius: 1000px;
      padding: 12px 26px;
      transition: background-color .2s ease, color .2s ease, border-color .2s ease;
    }
    .btn-login {
      background: transparent;
      color: #000;
      border: 1px solid #000;
    }
    .btn-login:hover { background: rgba(0, 0, 0, 0.05); }
    .btn-signup {
      background: #000;
      color: #fff;
      border: 1px solid #000;
    }
    .btn-signup:hover { background: #2c2e2f; }

    /* ============ Hero ============ */
    .hero {
      background: #00b2f0;
      padding-top: 64px;
      position: relative;
      overflow: clip;
    }

    /* Segment toggle */
    .segment-group {
      display: flex;
      justify-content: center;
    }
    .segment-nav ul {
      display: inline-flex;
      align-items: center;
      border: 2px solid #000;
      border-radius: 1000px;
      overflow: hidden;
    }
    .segment-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 1000px;
      color: #000;
    }
    .segment-tab.active {
      background: #000;
      color: #fff;
    }

    /* Headline */
    .hero-headline {
      text-align: center;
      font-weight: 900;
      font-size: clamp(64px, 9.5vw, 150px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #000;
      margin-top: clamp(80px, 12vw, 190px);
    }

    /* Phone frame */
    .phone-frame-wrapper {
      display: flex;
      justify-content: center;
      margin-top: clamp(80px, 11vw, 170px);
    }
    .phone-frame {
      width: min(600px, calc(100vw - 48px));
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 44px 0 0;
      text-align: center;
    }
    .phone-frame-logo {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }
    .phone-frame-logo svg { height: 52px; }
    .phone-frame img {
      width: 100%;
      display: block;
    }

    /* Sticky QR badge */
    .sticky-qr {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 92px;
      height: 92px;
      background: #000;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: transform .15s ease;
    }
    .sticky-qr:hover { transform: scale(1.04); }
    .sticky-qr img {
      width: 72px;
      height: 72px;
      display: block;
    }
  </style>
</head>

      <div class="header-actions">
